[project]
name = "gravityml"
version = "0.1.0"
description = "A configurable toolkit for certifying tabular datasets and training regression models on them."
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "import-linter>=2.12",
    "jupyterlab>=4.6.0",
    "lightning>=2.6.5",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.3.260530",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "ruff>=0.15.20",
    "safetensors>=0.8.0",
]

[project.scripts]
gravityml = "gravityml.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravityml"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
